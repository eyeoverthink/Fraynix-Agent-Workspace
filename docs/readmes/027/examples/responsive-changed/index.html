<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Observation & prediction explorer</title>
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:sans-serif;padding:1rem;display:flex;flex-direction:column;gap:1rem;max-width:100%;}
#controls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;}
#filter,input,button{font:inherit;padding:8px;min-height:32px;}
#row-count{font-weight:bold;margin-left:auto;}
#scope,#data-quality,#endpoint-error,#prediction-error{margin-top:.5rem;font-size:1rem;}
.table-wrapper{overflow:auto;position:relative;max-width:100%;}
#data-table{width:100%;border-collapse:collapse;table-layout:fixed;}
#data-table th, #data-table td{font-size:14px;padding:.4rem;border:1px solid #ddd;text-align:left;overflow-wrap:anywhere;}
#data-table th{background:#f9f9f9;position:-webkit-sticky;position:sticky;top:0;z-index:2;}
svg{width:100%;height:auto;background:#fff;border:1px solid #ccc;margin-top:.5rem;}
.legend{display:flex;gap:.5rem;font-size:.9rem;align-items:center;margin-top:.5rem;}
.legend span{display:inline-block;width:12px;height:12px;background:currentColor;margin-right:.3rem;}
</style>
</head>
<body>
<h1 id="title"></h1>
<div id="controls">
<label for="filter">Filter series:</label>
<input type="text" id="filter" placeholder="exact series name"/>
<button id="reset">Reset</button>
<span id="row-count"></span>
</div>
<div class="table-wrapper"><table id="data-table">
<thead><tr><th>series</th><th>time_s</th><th>position_m</th><th>source_kind</th></tr></thead>
<tbody></tbody>
</table></div>
<p id="scope">Observation data and a separate native simulation. No physical calibration or causal equivalence is claimed.</p>
<p id="data-quality">Quality flags retained</p>
<p>Endpoint error: <span id="endpoint-error"></span></p>
<p>Prediction error: <span id="prediction-error"></span></p>
<svg viewBox="0 0 800 300" aria-label="native simulation">
<title>Native Simulation</title>
<polyline data-series="native_actual" fill="none" stroke="#0077cc" stroke-width="2"/>
<polyline data-series="native_prediction" fill="none" stroke="#ff6600" stroke-width="2"/>
<!-- Axes and legend -->
<g id="axes">
<line x1="40" y1="260" x2="760" y2="260" stroke="#000"/>
<line x1="40" y1="260" x2="40" y2="40" stroke="#000"/>
</g>
<text x="400" y="295" text-anchor="middle" font-size="12">time (s)</text>
<text transform="rotate(-90)" x="-150" y="20" text-anchor="middle" font-size="12">position (m)</text>
<div class="legend">
<span style="color:#0077cc;"></span>native_actual
<span style="color:#ff6600;"></span>native_prediction
</div>
</svg>
<script>
(async()=>{
 const sourceData=await (await fetch('inputs/source.json')).json();
 document.getElementById('title').textContent=sourceData.title||'';
 const tbody=document.querySelector('#data-table tbody');
 function renderTable(rows){tbody.innerHTML='';rows.forEach(r=>{const tr=document.createElement('tr');sourceData.headers.forEach(h=>{const td=document.createElement('td');td.textContent=r[h];tr.appendChild(td);});tbody.appendChild(tr);});}
 let currentRows=sourceData.rows;
 renderTable(currentRows);
 document.getElementById('row-count').textContent=currentRows.length.toString();
 const filterInput=document.getElementById('filter');
 filterInput.addEventListener('input',()=>{const val=filterInput.value;currentRows=val?sourceData.rows.filter(r=>r.series===val):sourceData.rows;renderTable(currentRows);document.getElementById('row-count').textContent=currentRows.length.toString();});
 document.getElementById('reset').addEventListener('click',()=>{filterInput.value='';currentRows=sourceData.rows;renderTable(currentRows);document.getElementById('row-count').textContent=currentRows.length.toString();});
 // SVG polylines
 const actualRows=sourceData.rows.filter(r=>r.series==='native_actual');
 const predRows=sourceData.rows.filter(r=>r.series==='native_prediction');
 function pointsFrom(rows){return rows.map(r=>{const t=parseFloat(r.time_s);const p=parseFloat(r.position_m);const x=40+720*t/1.5;const y=260-220*p/2.0;return `${x.toFixed(3)},${y.toFixed(3)}`;}).join(' ');} 
 document.querySelector("polyline[data-series='native_actual']").setAttribute('points',pointsFrom(actualRows));
 document.querySelector("polyline[data-series='native_prediction']").setAttribute('points',pointsFrom(predRows));
 // static texts
 document.getElementById('endpoint-error').textContent='0.022500';
 document.getElementById('prediction-error').textContent='0.000443';
})();
</script>
</body>
</html>
