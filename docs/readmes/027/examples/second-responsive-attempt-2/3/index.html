<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Observation & prediction explorer</title>
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden;background:#fff;}
#controls{display:flex;gap:10px;padding:10px;background:#f5f5f5;align-items:center;flex-wrap:wrap;}
#controls input,#controls button{font:inherit;padding:8px;border:1px solid #ccc;border-radius:4px;min-height:32px;min-width:0;}
#info{display:flex;gap:20px;padding:10px;background:#fafafa;font-size:14px;flex-wrap:wrap;}
#info div{margin-right:10px;}
#table-wrapper{flex:1 1 auto;overflow:auto;display:flex;flex-direction:column;}
#data-table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:14px;}
#data-table th, #data-table td{padding:4px 8px;border:1px solid #ddd;text-align:left;overflow-wrap:anywhere;}
#data-table thead{background:#e0e0e0;position:-webkit-sticky;position:sticky;top:0;z-index:2;}
svg{width:100%;height:auto;border:1px solid #ccc;margin-top:10px;}
@media(max-width:400px){#controls{font-size:12px;}#info{font-size:12px;}}
</style>
</head>
<body>
<div id="controls">
  <h2 id="title"></h2>
  <label>Rows: <span id="row-count">0</span></label>
  <input type="text" id="filter" placeholder="Filter series"/>
  <button id="reset">Reset</button>
</div>
<div id="info">
  <div id="scope"></div>
  <div id="data-quality"></div>
  <div>Endpoint error: <span id="endpoint-error"></span></div>
  <div>Prediction error: <span id="prediction-error"></span></div>
</div>
<div id="table-wrapper">
  <table id="data-table"><thead><tr><th>Series</th><th>Time (s)</th><th>Position (m)</th><th>Source kind</th></tr></thead><tbody></tbody></table>
</div>
<svg viewBox="0 0 800 300" aria-label="Native simulation graph"><g id="axes">
  <line x1="40" y1="260" x2="760" y2="260" stroke="#000"/>
  <line x1="40" y1="260" x2="40" y2="40" stroke="#000"/>
</g><text x="400" y="290" text-anchor="middle">Time (s)</text><text transform="rotate(-90) translate(-150,20)" text-anchor="middle">Position (m)</text><g id="legend" transform="translate(650,50)"><rect width="120" height="60" fill="#fff" stroke="#000"/><line x1="10" y1="15" x2="30" y2="15" stroke="#f00"/><text x="35" y="20">native_actual</text><line x1="10" y1="35" x2="30" y2="35" stroke="#00f"/><text x="35" y="40">native_prediction</text></g>
<polyline data-series='native_actual' fill='none' stroke='#f00' stroke-width='2'/><polyline data-series='native_prediction' fill='none' stroke='#00f' stroke-width='2'/></svg>
<script>
(async()=>{
  const sourceData = await (await fetch('inputs/source.json')).json();
  document.getElementById('title').textContent=sourceData.title||'';
  const tbody=document.querySelector('#data-table tbody');
  const renderTable=(filter)=>{tbody.innerHTML='';let count=0;for(const r of sourceData.rows){if(filter&&r.series!==filter)continue;const tr=document.createElement('tr');for(const h of sourceData.headers){const td=document.createElement('td');td.textContent=r[h];tr.appendChild(td);}tbody.appendChild(tr);count++;}document.getElementById('row-count').textContent=count;};
  renderTable('');
  const filterInput=document.getElementById('filter');
  filterInput.addEventListener('input',()=>renderTable(filterInput.value));
  document.getElementById('reset').addEventListener('click',()=>{filterInput.value='';renderTable('');});
  const actualPoints=[],predPoints=[];
  for(const r of sourceData.rows){const t=Number(r.time_s),p=Number(r.position_m);if(r.series==='native_actual'){actualPoints.push([40+720*t/1.5,260-220*p/2]);}else if(r.series==='native_prediction'){predPoints.push([40+720*t/1.5,260-220*p/2]);}}
  const setPoly=(series,pts)=>{const poly=document.querySelector(`polyline[data-series='${series}']`);poly.setAttribute('points',pts.map(([x,y])=>x.toFixed(3)+','+y.toFixed(3)).join(' '));};
  setPoly('native_actual',actualPoints);
  setPoly('native_prediction',predPoints);
  document.getElementById('scope').textContent='Observation data and a separate native simulation. No physical calibration or causal equivalence is claimed.';
  document.getElementById('data-quality').textContent='Quality flags retained';
  document.getElementById('endpoint-error').textContent='0.022500';
  document.getElementById('prediction-error').textContent='0.000443';
})();
</script>
</body>
</html>
