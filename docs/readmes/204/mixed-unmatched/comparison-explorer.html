
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Verified comparison explorer</title>
<style>
:root {color-scheme:dark;color:#eef7f6;background:#13202a;font:15px/1.5 system-ui,sans-serif}
* {box-sizing:border-box}
body {margin:0;padding:clamp(14px,3.2vw,34px)}
main {max-width:72rem;margin:auto}
h1 {font-size:clamp(1.6rem,4.5vw,2.35rem);line-height:1.15;margin:0 0 8px}
p {margin:0 0 12px;color:#bed1d9}
.filters,.filter-set {display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.filters {gap:9px;margin:16px 0 12px}
button {font:inherit;color:#e4eef2;border:1px solid #415e6d;background:#1b303b;padding:4px 10px;border-radius:6px;cursor:pointer}
button[aria-pressed=true] {color:#0f2927;background:#a6e8d5;border-color:#a6e8d5;font-weight:650}
#reset-filters {margin-left:auto}
#visible-count {font-weight:650;color:#f0faf7;margin-bottom:5px}
#visible-totals {display:grid;gap:6px;margin-bottom:10px}
#visible-totals div {padding:5px 9px;border-radius:5px;background:#1e3541;color:#cee9e4}
.table-wrap {overflow:auto;border:1px solid #3b5260;border-radius:8px}
table {width:100%;min-width:32rem;border-collapse:collapse;background:#162731;font-variant-numeric:tabular-nums;text-align:left}
th,td {padding:6px 9px;vertical-align:top;border-bottom:1px solid #324854}
th {background:#203640;color:#c6d8df;font-size:.84rem}
tbody tr:last-child td {border-bottom:0}
tbody tr:nth-child(even) {background:#1c2d38}
.key {white-space:pre-wrap;overflow-wrap:anywhere}
.status {color:#f3d1a6}
.status.matched {color:#b9f0de}
.status.added {color:#c6ddff}
details {margin-top:13px}
summary {cursor:pointer;color:#d5e6e9}
details p {margin:6px 0;overflow-wrap:anywhere}
nav {display:flex;flex-wrap:wrap;gap:8px 16px}
a {color:#b9f0de}
@media(max-width:560px) {#reset-filters {margin-left:0}}
</style>
</head>
<body>
<main>
<h1>Verified comparison explorer</h1>
<p>Filter the comparison to see source rows and changes by output unit.</p>
<div class="filters">
  <div class="filter-set" role="group" aria-label="Output unit">
    <button id="unit-all" type="button" data-unit="all" aria-pressed="true">All units</button>
    <button id="unit-f" type="button" data-unit="°F" aria-pressed="false">°F</button>
    <button id="unit-mm" type="button" data-unit="mm" aria-pressed="false">mm</button>
  </div>
  <div class="filter-set" role="group" aria-label="Group status">
    <button id="status-all" type="button" data-status="all" aria-pressed="true">All statuses</button>
    <button type="button" data-status="Matched" aria-pressed="false">Matched</button>
    <button type="button" data-status="Added" aria-pressed="false">Added</button>
    <button id="status-missing" type="button" data-status="Missing" aria-pressed="false">Missing</button>
    <button id="status-duplicate" type="button" data-status="Duplicate" aria-pressed="false">Duplicate</button>
  </div>
  <button id="reset-filters" type="button">Reset</button>
</div>
<p id="visible-count" aria-live="polite"></p>
<div id="visible-totals"></div>
<div class="table-wrap" tabindex="0" role="region" aria-label="Comparison rows">
<table>
<thead><tr><th scope="col">Key</th><th scope="col">Unit</th><th scope="col">Status</th><th scope="col">Earlier row: value</th><th scope="col">Later row: value</th><th scope="col">Change</th></tr></thead>
<tbody id="visible-rows"></tbody>
</table>
</div>
<details open>
  <summary>Verified inputs</summary>
  <p id="source-id"></p>
  <p id="source-hash"></p>
  <p id="parent-proof"></p>
  <nav aria-label="Original evidence">
    <a href="matched-comparison.csv" download>Comparison CSV</a>
    <a href="import-receipt.json" download>Import receipt</a>
    <a href="summary-proof.json" download>Summary proof</a>
  </nav>
</details>
</main>
<script>
'use strict';
const statuses = ['Matched','Added','Missing','Duplicate'];
const units = new Set(['°F','mm']);
const scale = 100000n;
function bytes(base64) {
    return Uint8Array.from(atob(base64), char => char.charCodeAt(0));
}

function csvRows(input) {
    const rows = [];
    let row = [], field = '', quoted = false, closed = false;
    for (let i = 0; i < input.length; i++) {
        const char = input[i];
        if (quoted) {
            if (char !== '"') field += char;
            else if (input[i+1] === '"') { field += '"'; i++; }
            else { quoted = false; closed = true; }
        } else if (char === '"') {
            if (field || closed) throw Error('Misplaced quote in comparison CSV');
            quoted = true;
        } else if (char === ',' || char === '\n') {
            row.push(field);
            field = '';
            closed = false;
            if (char === '\n') { rows.push(row); row = []; }
        } else {
            if (closed) throw Error('Unexpected comparison CSV text');
            field += char;
        }
    }
    if (quoted || closed || field || row.length) throw Error('Incomplete comparison CSV row');
    return rows;
}

function number(text) {
    const parts = /^(-?)([0-9]+)(?:\.([0-9]{1,5}))?$/.exec(text);
    if (!parts || parts[0] !== text) throw Error('Invalid decimal delta');
    const magnitude = BigInt(parts[2] + (parts[3] || '').padEnd(5,'0'));
    return parts[1] ? -magnitude : magnitude;
}

function display(value, signed, unit, matched) {
    if (!matched) return '—';
    const absolute = value < 0n ? -value : value;
    const fraction = (absolute % scale).toString().padStart(5,'0').replace(/0+$/,'');
    const sign = value < 0n ? '-' : signed && value > 0n ? '+' : '';
    return sign + (absolute / scale) + (fraction ? '.' + fraction : '') + ' ' + unit;
}

function countsByUnit(rows) {
    const totals = new Map();
    for (const row of rows) {
        const [,unit,status,,,delta] = row;
        if (row.length !== 6 || !units.has(unit) || !statuses.includes(status) || (status === 'Matched') !== Boolean(delta))
            throw Error('Invalid comparison group');
        if (!totals.has(unit)) totals.set(unit,{counts:new Map(statuses.map(name=>[name,0])),net:0n,absolute:0n});
        const total = totals.get(unit);
        total.counts.set(status,total.counts.get(status)+1);
        if (status === 'Matched') {
            const value = number(delta);
            total.net += value;
            total.absolute += value < 0n ? -value : value;
        }
    }
    return totals;
}

function node(tag,text,id) {
    const element = document.createElement(tag);
    element.textContent = text;
    if (id) element.id = id;
    return element;
}

function visibleKey(key) {
    return '"' + key.replaceAll('\\','\\\\').replaceAll('"','\\"')
        .replaceAll('\t','\\t').replaceAll('\r','\\r').replaceAll('\n','\\n') + '"';
}

function readingText(json) {
    const readings = JSON.parse(json);
    return readings.length ? readings.map(reading=>'#'+reading.row+': '+reading.value).join(' · ') : '—';
}

function rowNode(row) {
    const [key,unit,status,earlier,later,delta] = row;
    const cells = [visibleKey(JSON.parse(key)),unit,status,readingText(earlier),readingText(later),
        delta ? display(number(delta),true,'',true).trim() : '—'];
    const element = document.createElement('tr');
    cells.forEach((value,i)=>{
        const cell = node('td',value);
        if (i === 0) cell.className = 'key';
        if (i === 2) cell.className = 'status '+status.toLowerCase();
        element.append(cell);
    });
    return element;
}

function showTotals(rows) {
    const totals = countsByUnit(rows);
    const lines = [];
    for (const unit of units) {
        const total = totals.get(unit);
        if (!total) continue;
        const counts = statuses.map(status=>status+' '+total.counts.get(status)).join(' · ');
        const matched = total.counts.get('Matched');
        lines.push(node('div',unit+' · '+counts+' · Net '+display(total.net,true,unit,matched)
            +' · Absolute '+display(total.absolute,false,unit,matched)));
    }
    document.getElementById('visible-totals').replaceChildren(...(lines.length ? lines : [node('div','No matching groups.')]));
}

function installFilters(rows) {
    const unitButtons = [...document.querySelectorAll('button[data-unit]')];
    const statusButtons = [...document.querySelectorAll('button[data-status]')];
    let unit = 'all', status = 'all';
    function update() {
        const visible = rows.filter(row=>(unit==='all'||row[1]===unit)&&(status==='all'||row[2]===status));
        document.getElementById('visible-count').textContent = visible.length + (visible.length===1?' group':' groups');
        document.getElementById('visible-rows').replaceChildren(...visible.map(rowNode));
        showTotals(visible);
        unitButtons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.unit===unit)));
        statusButtons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.status===status)));
    }
    unitButtons.forEach(button=>{button.onclick=()=>{unit=button.dataset.unit;update();};});
    statusButtons.forEach(button=>{button.onclick=()=>{status=button.dataset.status;update();};});
    document.getElementById('reset-filters').onclick=()=>{unit='all';status='all';update();};
    update();
}

async function sha(data) {
    const digest = new Uint8Array(await crypto.subtle.digest('SHA-256',data));
    return [...digest].map(value=>value.toString(16).padStart(2,'0')).join('');
}

function downloadJson(name,data) {
    document.querySelector('a[download][href='+JSON.stringify(name)+']').addEventListener('click',event=>{
        event.preventDefault();
        const link = document.createElement('a');
        link.href = URL.createObjectURL(new Blob([data],{type:'application/json'}));
        link.download = name;
        link.click();
        setTimeout(()=>URL.revokeObjectURL(link.href),1000);
    });
}

</html>
