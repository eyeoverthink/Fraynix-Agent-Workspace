 const headers = sourceData.headers;
 const rows = sourceData.rows;
 let filteredRows = rows;
 const titleEl=document.getElementById('title');
 const countEl=document.getElementById('row-count');
 const filterInput=document.getElementById('filter');
 const resetBtn=document.getElementById('reset');
 const tbody=document.querySelector('#data-table tbody');
 const theadRow=document.querySelector('#data-table thead tr');
 const chartSvg=document.getElementById('chart');
 titleEl.textContent=sourceData.title;
 function renderTable(){
  tbody.innerHTML='';
  filteredRows.forEach(r=>{
   const tr=document.createElement('tr');
   headers.forEach(h=>{const td=document.createElement('td');td.textContent=r[h];tr.appendChild(td);});
   tbody.appendChild(tr);
  });
  countEl.textContent=filteredRows.length.toString();
 }
 function renderHeader(){
  theadRow.innerHTML='';headers.forEach(h=>{const th=document.createElement('th');th.textContent=h;theadRow.appendChild(th);});
 }
 function filterByProfile(val){
  if(!val) filteredRows=rows;
  else filteredRows=rows.filter(r=>r.profile===val);
  renderTable();
 }
 resetBtn.addEventListener('click',()=>{filterInput.value='';filterByProfile('');});
 filterInput.addEventListener('input',e=>filterByProfile(e.target.value));
 function renderChart(){
  const iouValues=rows.map(r=>parseFloat(r.iou)).filter(v=>!isNaN(v));
  if(iouValues.length===0)return;
  const width=chartSvg.clientWidth||400;const height=200;chartSvg.setAttribute('width',width);chartSvg.setAttribute('height',height);
  const max=Math.max(...iouValues);const min=Math.min(...iouValues);
  const binCount=20;const binSize=(max-min)/binCount;
  const bins=new Array(binCount).fill(0);
  iouValues.forEach(v=>{let idx=Math.floor((v-min)/binSize);if(idx===binCount)idx--;bins[idx]++;});
  const maxBin=Math.max(...bins);
  const barWidth=width/binCount;
  chartSvg.innerHTML='';
  bins.forEach((cnt,i)=>{
   const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');
   rect.setAttribute('x',i*barWidth);
   rect.setAttribute('y',height- (cnt/maxBin)*height);
   rect.setAttribute('width',barWidth-2);
   rect.setAttribute('height',(cnt/maxBin)*height);
   rect.setAttribute('fill','#007bff');
   chartSvg.appendChild(rect);
  });
 }
 renderHeader();renderTable();renderChart();
})();
