<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Recorded observations & native forecasts</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:1rem;background:#f9f9f9;}
#controls{display:flex;gap:.5rem;margin-bottom:1rem;align-items:center;}
#filter{flex:1;padding:.25rem;border:1px solid #ccc;border-radius:4px;}
button{padding:.3rem 1rem;background:#007bff;color:white;border:none;border-radius:4px;cursor:pointer;}
button:hover{background:#0069d9;}
#row-count{font-weight:bold;margin-left:.5rem;}
#scope,#data-quality,#endpoint-error,#prediction-error{margin-top:.5rem;font-size:.9rem;color:#555;}
#data-table{width:100%;border-collapse:collapse;background:white;border:1px solid #ddd;margin-top:1rem;overflow:auto;max-height:300px;display:block;}
#data-table thead{position:absolute;width:100%}/* hack for scrollable tbody */
#data-table th,td{padding:.5rem;text-align:left;border-bottom:1px solid #eee;}
#chart{margin-top:1rem;overflow:auto;background:white;padding:1rem;border:1px solid #ddd;}
svg{border:1px solid #ccc;background:#fff;display:block;margin:auto;}
.legend{font-size:.9rem;margin-top:.5rem;display:flex;gap:1rem;align-items:center;}
.legend span{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:.3rem;}
</style>
</head>
<body>
<h1 id="title"></h1>
<div id="controls">
<input type="text" id="filter" placeholder="Filter by series"/>
<button id="reset">Reset</button>
<span>#row-count: <span id="row-count"></span></span>
</div>
<table id="data-table"><thead><tr id="header-row"></tr></thead><tbody id="table-body"></tbody></table>
<div id="chart">
<svg width="800" height="300" viewBox="0 0 800 300">
<g transform="translate(40,260)">
<line x1="0" y1="0" x2="720" y2="0" stroke="#ccc"/>
<line x1="0" y1="-220" x2="0" y2="-220" stroke="#ccc"/>
</g>
<polyline data-series="native_actual" fill="none" stroke="red" stroke-width="2" />
<polyline data-series="native_prediction" fill="none" stroke="blue" stroke-width="2" />
</svg>
<div class="legend"><span style="background:red;"></span>Native Actual<br><span style="background:blue;"></span>Native Prediction</div>
</div>
<p id="scope"></p>
<p id="data-quality"></p>
<p id="endpoint-error"></p>
<p id="prediction-error"></p>
<script>
(async()=>{
const sourceData=await (await fetch('inputs/source.json')).json();
const titleEl=document.getElementById('title');
titleEl.textContent=sourceData.title||'';
const headers=sourceData.headers||[];
const rows=sourceData.rows||[];
const rowCountEl=document.getElementById('row-count');
const filterInput=document.getElementById('filter');
const resetBtn=document.getElementById('reset');
const headerRow=document.getElementById('header-row');
const tbody=document.getElementById('table-body');
const polyActual=document.querySelector("polyline[data-series='native_actual']");
const polyPred=document.querySelector("polyline[data-series='native_prediction']");
function renderTable(filter){
tbody.innerHTML='';
let count=0;
for(const r of rows){
if(!filter||r.series===filter){
const tr=document.createElement('tr');
for(const h of headers){const td=document.createElement('td');td.textContent=r[h];tr.appendChild(td);}tbody.appendChild(tr);count++;}
}
rowCountEl.textContent=count;
}
function renderPolylines(){
const pointsActual=[];const pointsPred=[];
for(const r of rows){if(r.series==='native_actual'){const t=Number(r.time_s),p=Number(r.position_m);pointsActual.push([40+720*t/1.5,260-220*p/1.8]);}
else if(r.series==='native_prediction'){const t=Number(r.time_s),p=Number(r.position_m);pointsPred.push([40+720*t/1.5,260-220*p/1.8]);}}
polyActual.setAttribute('points',pointsActual.map(([x,y])=>x.toFixed(3)+','+y.toFixed(3)).join(' '));
polyPred.setAttribute('points',pointsPred.map(([x,y])=>x.toFixed(3)+','+y.toFixed(3)).join(' '));}
// init headers
for(const h of headers){const th=document.createElement('th');th.textContent=h;headerRow.appendChild(th);}
renderTable();
renderPolylines();
filterInput.addEventListener('input',e=>{renderTable(e.target.value||null);});
resetBtn.addEventListener('click',()=>{filterInput.value='';renderTable();});
// static texts
document.getElementById('scope').textContent='Observation data and a separate native simulation. No physical calibration or causal equivalence is claimed.';
document.getElementById('data-quality').textContent='Within declared thresholds';
document.getElementById('endpoint-error').textContent='0.024574';
document.getElementById('prediction-error').textContent='0.000523';
})();
</script>
</body>
</html>
