name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify README editions, maps and links
        shell: pwsh
        run: .\scripts\Verify-Documentation.ps1
      - name: Compile, test and package
        shell: pwsh
        run: .\gradlew.bat --no-daemon --console=plain :clean :check :distZip
      - uses: actions/upload-artifact@v4
        with:
          name: Fraynix-Studio-Windows
          path: build/distributions/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: build/reports/tests/test/
