name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Provision software OpenGL for native tests
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mesa3d.7z'
          $mesa = Join-Path $env:RUNNER_TEMP 'mesa3d'
          Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.5/mesa3d-26.2.5-release-msvc.7z' -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '997123ef4ce8896204ab912d5b54f19372c487ff9835bcefafa2fca23b8953c2') {
            throw 'Mesa archive checksum mismatch'
          }
          7z x $archive "-o$mesa" -y
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          # Application-local DLLs serve both the test JVM and its embedded-game child.
          Copy-Item "$mesa\x64\opengl32.dll", "$mesa\x64\libgallium_wgl.dll" "$env:JAVA_HOME\bin"
          'GALLIUM_DRIVER=llvmpipe' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify README editions, maps and links
        shell: pwsh
        run: .\scripts\Verify-Documentation.ps1
      - name: Compile, test and package
        shell: pwsh
        run: .\gradlew.bat --no-daemon --console=plain :clean :check :distZip
      - uses: actions/upload-artifact@v4
        with:
          name: Fraynix-Studio-Windows
          path: build/distributions/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            build/reports/tests/test/
            **/build/reports/tests/test/
            **/build/test-results/test/
            workspace-engine/build/reference115/
            workspace-engine/build/reference116/
            workspace-engine/build/controller116/
            build/renderer116/
