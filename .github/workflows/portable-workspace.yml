
name: Portable workspace

on:
  push:
    paths:
      - '.github/workflows/portable-workspace.yml'
      - 'Launch-Agent-Workspace.*'
      - 'gradle/**'
      - 'gradle.lockfile'
      - '**/build.gradle'
      - 'src/main/**'
      - 'workspace-engine/src/main/**'
      - 'workspace-desktop/**'
      - 'scripts/Verify-Desktop-Cache.cjs'
  pull_request:
    paths:
      - '.github/workflows/portable-workspace.yml'
      - 'Launch-Agent-Workspace.*'
      - '**/build.gradle'
      - 'gradle/**'
      - 'gradle.lockfile'
      - 'src/main/**'
      - 'workspace-engine/src/main/**'
      - 'workspace-desktop/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: windows-x64, runner: windows-latest}
          - {target: linux-x64, runner: ubuntu-24.04}
          - {target: macos-x64, runner: macos-15-intel}
          - {target: macos-arm64, runner: macos-15}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            gradle
            src
            assets
            levels
            libs
            licenses
            models
            scripts
            fraynix-modules
            workspace-desktop
            workspace-engine
            docs/datasets/delfys75-013
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare workspace on macOS or Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/workspace-prepare.log"
            if ./Launch-Agent-Workspace.sh --prepare >"$log" 2>&1; then
              cat "$log"
              exit 0
            fi
            cat "$log"
            if [ "$attempt" -eq 3 ] || ! grep -q 'Received status code 429' "$log"; then
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
      - name: Prepare workspace on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\Launch-Agent-Workspace.bat -PrepareOnly
      - name: Provision Linux software OpenGL and a display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libgtk-3-0t64 libgbm1 libnss3 libasound2t64
      - name: Provision Windows software OpenGL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mesa-portable-workspace.7z'
          $mesa = Join-Path $env:RUNNER_TEMP 'mesa-portable-workspace'
          Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.5/mesa3d-26.2.5-release-msvc.7z' -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '997123ef4ce8896204ab912d5b54f19372c487ff9835bcefafa2fca23b8953c2') {
            throw 'Mesa archive checksum mismatch'
          }
          7z x $archive "-o$mesa" -y
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          Copy-Item "$mesa\x64\opengl32.dll", "$mesa\x64\libgallium_wgl.dll" "$env:JAVA_HOME\bin"
          'GALLIUM_DRIVER=llvmpipe' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Exercise desktop, native game and restart
        if: runner.os != 'Linux'
        env:
          FRAYNIX_CI_MAC_DISPLAY: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: node workspace-desktop/test/portable-smoke.cjs build/portable-smoke
      - name: Exercise desktop, native game and restart on virtual display
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          FRAYNIX_WORKSPACE_CI_CHROMIUM: '1'
        run: xvfb-run -a node workspace-desktop/test/portable-smoke.cjs build/portable-smoke
      - name: Verify a reviewed hypothesis with original Game Lab replays on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --console=plain :workspace-engine:test --tests '*HypothesisExperimentTest' --tests '*SpatialExchangeTest' --tests '*SpatialPropExchangeTest' --tests '*SpatialCarryTest' --tests '*MetricHeightStudyTest' --tests '*SpatialReconstructionTest' --tests '*SpatialReconstructionDepthTest' --tests '*SpatialReconstructionMultiDepthTest' --tests '*SpatialReconstructionAxisDepthTest' --tests '*TranslationTimelineTest' --tests '*SpatialFaceExtrusionTest'
      - name: Verify a reviewed hypothesis and Game Lab availability on macOS
        if: runner.os == 'macOS'
        env:
          FRAYNIX_CI_MAC_DISPLAY: '1'
        run: ./gradlew --console=plain :workspace-engine:test --tests '*HypothesisExperimentTest' --tests '*SpatialExchangeTest' --tests '*SpatialPropExchangeTest' --tests '*SpatialCarryTest' --tests '*MetricHeightStudyTest' --tests '*SpatialReconstructionTest' --tests '*SpatialReconstructionDepthTest' --tests '*SpatialReconstructionMultiDepthTest' --tests '*SpatialReconstructionAxisDepthTest' --tests '*TranslationTimelineTest' --tests '*SpatialFaceExtrusionTest'
      - name: Verify a reviewed hypothesis with original Game Lab replays on Linux
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a ./gradlew --console=plain :workspace-engine:test --tests '*HypothesisExperimentTest' --tests '*SpatialExchangeTest' --tests '*SpatialPropExchangeTest' --tests '*SpatialCarryTest' --tests '*MetricHeightStudyTest' --tests '*SpatialReconstructionTest' --tests '*SpatialReconstructionDepthTest' --tests '*SpatialReconstructionMultiDepthTest' --tests '*SpatialReconstructionAxisDepthTest' --tests '*TranslationTimelineTest' --tests '*SpatialFaceExtrusionTest'
      - name: Retain detailed prop and collider checks
        run: node -e "require('node:fs').copyFileSync('workspace-engine/build/test-results/test/TEST-fraymus.workspace.SpatialPropExchangeTest.xml','build/portable-smoke/spatial-prop-exchange.xml')"
      - name: Retain verified doorway checks
        run: node -e "require('node:fs').copyFileSync('workspace-engine/build/test-results/test/TEST-fraymus.workspace.SpatialCarryTest.xml','build/portable-smoke/spatial-doorway.xml')"
      - name: Retain calibrated camera and collider checks
        run: node -e "require('node:fs').copyFileSync('workspace-engine/build/test-results/test/TEST-fraymus.workspace.MetricHeightStudyTest.xml','build/portable-smoke/metric-height-study.xml')"
      - name: Retain images-to-mesh native checks
        run: node -e "require('node:fs').copyFileSync('workspace-engine/build/test-results/test/TEST-fraymus.workspace.SpatialReconstructionTest.xml','build/portable-smoke/spatial-reconstruction.xml')"
      - name: Retain first-hit depth geometry checks
        run: node -e "require('node:fs').copyFileSync('workspace-engine/build/test-results/test/TEST-fraymus.workspace.SpatialReconstructionDepthTest.xml','build/portable-smoke/spatial-depth.xml')"
      - name: Retain opposing depth geometry checks
        run: node -e "require('node:fs').copyFileSync('workspace-engine/build/test-results/test/TEST-fraymus.workspace.SpatialReconstructionMultiDepthTest.xml','build/portable-smoke/spatial-multidepth.xml')"
      - name: Retain perpendicular depth geometry checks
        run: node -e "require('node:fs').copyFileSync('workspace-engine/build/test-results/test/TEST-fraymus.workspace.SpatialReconstructionAxisDepthTest.xml','build/portable-smoke/spatial-axis-depth.xml')"
      - name: Retain native scene exchange checks
        run: node -e "require('node:fs').copyFileSync('workspace-engine/build/test-results/test/TEST-fraymus.workspace.SpatialExchangeTest.xml','build/portable-smoke/spatial-exchange.xml')"
      - name: Retain native hypothesis test evidence
        run: node -e "require('node:fs').copyFileSync('workspace-engine/build/hypothesis-experiment-ci.json','build/portable-smoke/hypothesis-experiment.json')"
      - name: Verify comparison charts, cited briefings and explanation audits
        if: runner.os != 'Linux'
        run: node workspace-desktop/test/change-story-integration.cjs build/portable-smoke/change-story
      - name: Verify comparison charts, cited briefings and explanation audits on virtual display
        if: runner.os == 'Linux'
        env:
          FRAYNIX_WORKSPACE_CI_CHROMIUM: '1'
        run: xvfb-run -a node workspace-desktop/test/change-story-integration.cjs build/portable-smoke/change-story
      - name: Verify ordinary chat requests and reopen their evidence
        if: runner.os != 'Linux'
        run: node workspace-desktop/test/plain-language-integration.cjs build/portable-smoke/plain-language
      - name: Verify ordinary chat requests on virtual display
        if: runner.os == 'Linux'
        env:
          FRAYNIX_WORKSPACE_CI_CHROMIUM: '1'
        run: xvfb-run -a node workspace-desktop/test/plain-language-integration.cjs build/portable-smoke/plain-language
      - name: Resolve a verified chart follow-up and reopen it
        if: runner.os != 'Linux'
        run: node workspace-desktop/test/chart-followup-integration.cjs build/portable-smoke/chart-followup
      - name: Resolve a verified chart follow-up on virtual display
        if: runner.os == 'Linux'
        env:
          FRAYNIX_WORKSPACE_CI_CHROMIUM: '1'
        run: xvfb-run -a node workspace-desktop/test/chart-followup-integration.cjs build/portable-smoke/chart-followup
      - name: Verify camera selection, height evidence and reviewed collider
        if: runner.os != 'Linux'
        run: node workspace-desktop/test/height-study-integration.cjs build/portable-smoke/height-study
      - name: Verify camera selection and reviewed collider on virtual display
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          FRAYNIX_WORKSPACE_CI_CHROMIUM: '1'
        run: xvfb-run -a node workspace-desktop/test/height-study-integration.cjs build/portable-smoke/height-study
      - name: Verify depth reconstruction and the source-bound export
        if: runner.os != 'Linux'
        run: node workspace-desktop/test/spatial-depth-integration.cjs build/portable-smoke/spatial-depth
      - name: Verify depth reconstruction and export on virtual display
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a node workspace-desktop/test/spatial-depth-integration.cjs build/portable-smoke/spatial-depth
      - name: Verify opposing depth fusion and conflicting source refusal
        if: runner.os != 'Linux'
        run: node workspace-desktop/test/spatial-multidepth-integration.cjs build/portable-smoke/spatial-multidepth
      - name: Verify opposing depth fusion on virtual display
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a node workspace-desktop/test/spatial-multidepth-integration.cjs build/portable-smoke/spatial-multidepth
      - name: Verify perpendicular depth, saved export and cross-axis refusal
        if: runner.os != 'Linux'
        run: node workspace-desktop/test/spatial-side-depth-integration.cjs build/portable-smoke/spatial-side-depth
      - name: Verify perpendicular depth on virtual display
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a node workspace-desktop/test/spatial-side-depth-integration.cjs build/portable-smoke/spatial-side-depth
      - name: Verify in-app animation editing and restart
        if: runner.os != 'Linux'
        run: node workspace-desktop/test/spatial-animation-integration.cjs build/portable-smoke/spatial-animation
      - name: Verify in-app animation editing on virtual display
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a node workspace-desktop/test/spatial-animation-integration.cjs build/portable-smoke/spatial-animation
      - name: Verify mesh extrusion, metric STL export and restart
        if: runner.os != 'Linux'
        run: node workspace-desktop/test/spatial-mesh-edit-integration.cjs build/portable-smoke/spatial-mesh-edit
      - name: Verify mesh extrusion and STL export on virtual display
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a node workspace-desktop/test/spatial-mesh-edit-integration.cjs build/portable-smoke/spatial-mesh-edit
      - name: Verify mesh components, collider refit and browser trace
        if: runner.os != 'Linux'
        run: node workspace-desktop/test/spatial-components-integration.cjs build/portable-smoke/spatial-components
      - name: Verify mesh components and browser trace on virtual display
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a node workspace-desktop/test/spatial-components-integration.cjs build/portable-smoke/spatial-components
      - name: Verify browser clicks, registered depth and held-out view
        if: runner.os != 'Linux'
        run: node workspace-desktop/test/browser-views-integration.cjs build/portable-smoke/browser-views
      - name: Verify registered browser views on virtual display
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a node workspace-desktop/test/browser-views-integration.cjs build/portable-smoke/browser-views
      - name: Verify top-view reconstruction against an elevated witness
        if: runner.os != 'Linux'
        run: node workspace-desktop/test/browser-views-integration.cjs build/portable-smoke/browser-top top
      - name: Verify fitted top view on virtual display
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a node workspace-desktop/test/browser-views-integration.cjs build/portable-smoke/browser-top top
      - name: Capture, build, reopen and play a media level offline
        if: runner.os != 'Linux'
        run: node workspace-desktop/test/media-workshop-integration.cjs build/portable-smoke/media-workshop
      - name: Play exported media on a virtual display
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a node workspace-desktop/test/media-workshop-integration.cjs build/portable-smoke/media-workshop
      - name: Verify tile editing, shared sprites and offline export after restart
        if: runner.os != 'Linux'
        run: node workspace-desktop/test/media-tile-integration.cjs build/portable-smoke/media-tiles
      - name: Verify tile editing and exported play on a virtual display
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a node workspace-desktop/test/media-tile-integration.cjs build/portable-smoke/media-tiles
      - name: Verify registered library assets and held-out refusal
        if: runner.os != 'Linux'
        run: node workspace-desktop/test/library-prop-integration.cjs build/portable-smoke/library-prop
      - name: Verify registered library assets on a virtual display
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a node workspace-desktop/test/library-prop-integration.cjs build/portable-smoke/library-prop
      - name: Verify reviewed prop placement, native collision and restart
        if: runner.os != 'Linux'
        run: node workspace-desktop/test/spatial-placement-integration.cjs build/portable-smoke/spatial-placement
      - name: Verify reviewed native prop placement on a virtual display
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a node workspace-desktop/test/spatial-placement-integration.cjs build/portable-smoke/spatial-placement
      - name: Verify portable collision evidence in a fresh project
        if: runner.os != 'Linux'
        run: node workspace-desktop/test/placement-exchange-integration.cjs build/portable-smoke/placement-exchange
      - name: Verify portable collision evidence on a virtual display
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a node workspace-desktop/test/placement-exchange-integration.cjs build/portable-smoke/placement-exchange
      - name: Verify existing-level placement and offline play
        if: runner.os != 'Linux'
        run: node workspace-desktop/test/spatial-level-integration.cjs build/portable-smoke/spatial-level
      - name: Verify existing-level placement and offline play on a virtual display
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a node workspace-desktop/test/spatial-level-integration.cjs build/portable-smoke/spatial-level
      - name: Verify browser reconstruction handoff and existing-level export
        if: runner.os != 'Linux'
        run: node workspace-desktop/test/browser-views-integration.cjs build/portable-smoke/browser-placement placement
      - name: Verify browser reconstruction handoff and export on a virtual display
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a node workspace-desktop/test/browser-views-integration.cjs build/portable-smoke/browser-placement placement
      - name: Verify fresh witness qualification and placement of an edited mesh
        if: runner.os != 'Linux'
        run: node workspace-desktop/test/browser-views-integration.cjs build/portable-smoke/mesh-qualification qualification
      - name: Verify mesh edit qualification and placement on a virtual display
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a node workspace-desktop/test/browser-views-integration.cjs build/portable-smoke/mesh-qualification qualification
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-proof-${{ matrix.target }}
          path: build/portable-smoke/
