plugins { id 'application' }
repositories { mavenCentral() }
dependencies {
    implementation project(':factory-runtime')
    implementation project(':factory-kernel')
    implementation project(':factory-models')
    implementation 'org.json:json:20231013'
    testImplementation 'junit:junit:4.13.2'
}
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
application { mainClass = 'fraymus.workspace.WorkspaceServer'; applicationName = 'workspace-engine' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test') { useJUnit() }
