plugins { id 'application' }
repositories { mavenCentral() }
dependencies {
    implementation project(':geometry-core')
    implementation project(':brain-core')
    implementation project(':brain-gpu')
    implementation project(':factory-runtime')
    implementation project(':factory-kernel')
    implementation project(':factory-models')
    implementation 'org.json:json:20231013'
    implementation 'com.github.stephengold:Minie:9.0.3'
    implementation 'org.jmonkeyengine:jme3-desktop:3.8.1-stable'
    testImplementation 'junit:junit:4.13.2'
}
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
application { mainClass = 'fraymus.workspace.WorkspaceServer'; applicationName = 'workspace-engine' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
// Large integrity studies retain originals plus forged copies and full verification.
// Measured096: unchanged checks exhaust512MiB; isolated1024MiB checks pass.
// Test limits only: production heaps and native budgets are unchanged.
tasks.withType(Test).configureEach {
    maxHeapSize = '1024m'
    maxParallelForks = 1
    forkEvery = 1
    jvmArgs '-XX:ActiveProcessorCount=4'
}
tasks.named('test') {
    useJUnit()
    dependsOn rootProject.tasks.named('prepareGameRuntime115')
    // These tests launch a separate native game JVM. Its code/assets are test
    // inputs too; changing only the controller must invalidate an old result.
    inputs.file(rootProject.tasks.named('jar').flatMap { it.archiveFile }).withPropertyName('nativeGameJar')
    inputs.files(rootProject.configurations.runtimeClasspath).withPropertyName('nativeGameClasspath')
    inputs.files(rootProject.fileTree('assets'), rootProject.fileTree('levels'), rootProject.file('level.txt')).withPropertyName('nativeGameAssets')
    inputs.property('nativeStudyOptions', providers.environmentVariable('JAVA_TOOL_OPTIONS').map { options ->
        options.split('\\s+').findAll { it.startsWith('-Dstudy116.') || it.startsWith('-Dstudy117.') || it.startsWith('-Dstudy118.') || it.startsWith('-Dstudy119.') || it.startsWith('-Dstudy120.') || it.startsWith('-Dstudy121.') || it.startsWith('-Dstudy122.') || it.startsWith('-Dreference116.') || it.startsWith('-Dreference117.') }.join(' ')
    }.orElse(''))
}
