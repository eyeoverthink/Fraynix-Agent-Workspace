<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'">
<title>Game Lab hypothesis experiment</title>
<style>
:root { color-scheme:dark; font:16px/1.55 system-ui,sans-serif; background:#101a23; color:#edf4f9; }
body { margin:0; } main { max-width:53rem; margin:auto; padding:clamp(1rem,4vw,2.5rem); }
h1 { font-size:clamp(1.65rem,4vw,2.4rem); line-height:1.15; }
h2 { font-size:1.15rem; } p { overflow-wrap:anywhere; }
#measure { background:#1c3544; padding:1rem; border-left:3px solid #91e0ca; }
.outcomes { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr)); gap:1rem; }
section { padding:1rem; border:1px solid #40586b; border-radius:.55rem; }
section h2 { margin-top:0; } a,strong { color:#aeeddb; }
table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
th,td { padding:.55rem .4rem; text-align:left; border-bottom:1px solid #40586b; }
figure { margin:1rem 0; } img { width:100%; height:auto; display:block; border-radius:.45rem; }
figcaption { margin:.45rem 0; color:#bfd2df; }
</style>
</head>
<body><main>@BODY@</main></body>
</html>
