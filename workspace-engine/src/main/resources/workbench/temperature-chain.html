<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Celsius to Rankine in two steps</title>
<style>
:root { color-scheme:dark; font:16px/1.5 system-ui,sans-serif; background:#101923; color:#e8f1f5; }
* { box-sizing:border-box; }
body { margin:0; padding:clamp(16px,4vw,42px); }
main { max-width:42rem; margin:auto; }
h1 { font-size:clamp(1.75rem,6vw,2.85rem); line-height:1.1; letter-spacing:-.035em; margin:0 0 12px; }
p { color:#b7ccd6; margin:0 0 1rem; }
label { display:block; font-weight:650; margin-bottom:.35rem; }
input,button { font:inherit; border-radius:7px; }
input { width:100%; border:1px solid #617c90; color:#edf8f9; background:#192936; padding:9px 12px; }
input[aria-invalid=true] { border-color:#ffb2a8; }
button { background:#9ae1d1; color:#12352f; padding:8px 12px; border:0; font-weight:650; cursor:pointer; }
button:disabled { opacity:.42; cursor:default; }
:focus-visible { outline:2px solid #a2f2de; outline-offset:3px; }
small { color:#b7ccd6; display:block; margin:.45rem 0 1rem; }
.steps { display:grid; gap:10px; }
section { padding:12px 15px; border:1px solid #3c5b6b; background:#192d38; border-radius:10px; }
h2 { font-size:1rem; margin:0 0 .4rem; }
output { display:block; font-weight:700; color:#ffd7ac; overflow-wrap:anywhere; font-size:1.15rem; margin:.4rem 0 0; }
#handoff { margin:.4rem 0 0; }
</style>
</head>
<body>
<main>
  <h1>Celsius to Rankine</h1>
  <p>Convert to Fahrenheit first, then pass that result to the second step.</p>
  <label for="celsius">Celsius (&deg;C)</label>
  <input id="celsius" type="text" inputmode="decimal" maxlength="40" autocomplete="off"
         spellcheck="false" aria-describedby="range" value="{{initialCelsius}}">
  <small id="range">Enter -273.15 to 1,000,000 &deg;C with up to four decimal places.</small>
  <div class="steps">
    <section>
      <h2>1. Celsius to Fahrenheit</h2>
      <button id="to-f" type="button">Convert to Fahrenheit</button>
      <output id="fahrenheit" for="celsius" aria-live="polite">Waiting for conversion.</output>
    </section>
    <section>
      <h2>2. Fahrenheit to Rankine</h2>
      <button id="to-r" type="button" disabled>Convert to Rankine</button>
      <p id="handoff" aria-live="polite" hidden></p>
      <output id="rankine" for="celsius" aria-live="polite">Waiting for conversion.</output>
    </section>
  </div>
</main>
<script>
'use strict';
const field = document.querySelector('#celsius');
const fahrenheit = document.querySelector('#fahrenheit');
const rankine = document.querySelector('#rankine');
const handoff = document.querySelector('#handoff');
const next = document.querySelector('#to-r');
let intermediate = null;

function format(scaled) {
  const magnitude = scaled < 0n ? -scaled : scaled;
  const fraction = (magnitude % 100000n).toString().padStart(5,'0').replace(/0+$/,'');
  return (scaled < 0n ? '-' : '') + magnitude / 100000n + (fraction ? '.' + fraction : '');
}

function reset() {
  intermediate = null;
  next.disabled = true;
  field.removeAttribute('aria-invalid');
  handoff.hidden = true;
  handoff.textContent = '';
  fahrenheit.textContent = 'Waiting for conversion.';
  rankine.textContent = 'Waiting for conversion.';
}

field.addEventListener('input',reset);
document.querySelector('#to-f').addEventListener('click',() => {
  reset();
  const value = /^([+-]?)([0-9]{1,7})(?:\.([0-9]{1,4}))?$/.exec(field.value.trim());
  const scaled = value ? BigInt(value[1] + value[2] + (value[3] || '').padEnd(4,'0')) : null;
  if (scaled === null || scaled < -2731500n || scaled > 10000000000n) {
    field.setAttribute('aria-invalid','true');
    fahrenheit.textContent = 'Enter a decimal within the stated range.';
    return;
  }
  // Scale Celsius by 10,000 and Fahrenheit by 100,000 before applying 9/5 and the offset.
  intermediate = {scaled:scaled * 18n + 3200000n, unit:'F'};
  fahrenheit.textContent = format(intermediate.scaled) + ' \u00b0F';
  next.disabled = false;
});

next.addEventListener('click',() => {
  if (intermediate?.unit !== 'F') return;
  handoff.textContent = format(intermediate.scaled) + ' \u00b0F';
  handoff.hidden = false;
  rankine.textContent = format(intermediate.scaled + 45967000n) + ' \u00b0R';
});
</script>
</body>
</html>
