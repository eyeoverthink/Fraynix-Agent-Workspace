<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>@TITLE@</title>
<style>
:root { color-scheme:light; background:#ecf0ec; color:#233a33; font:16px/1.55 system-ui,sans-serif; }
* { box-sizing:border-box; }
body { margin:0; }
[hidden] { display:none !important; }
main { max-width:58rem; margin:auto; padding:clamp(16px,5vw,42px); }
header { border-bottom:1px solid #a3b9ad; padding-bottom:1rem; margin-bottom:1.1rem; }
h1 { margin:.25rem 0; font:600 clamp(2rem,5vw,3.1rem)/1.06 Georgia,serif; }
h2 { margin:0; font-size:1.1rem; }
p { margin:.5rem 0; }
#briefing-count { color:#1b6957; font-weight:700; }
#briefing-scope { color:#40594e; }
.unit { background:#fff; border:1px solid #c7d5cd; border-radius:12px; padding:clamp(12px,4vw,24px); margin-bottom:1rem; }
.unit-heading { display:flex; gap:.4rem 1rem; justify-content:space-between; flex-wrap:wrap; }
.unit-heading strong { color:#116652; }
.unit-counts { color:#4c6358; font-size:.88rem; }
.claims { list-style:none; margin:.6rem 0 0; padding:0; }
.claims li { border-top:1px solid #d8e1db; padding:.65rem 0; }
.claim { font-weight:550; margin:0 0 .35rem; overflow-wrap:anywhere; }
details summary { cursor:pointer; color:#155b50; }
details summary:focus-visible { outline:2px solid #127963; outline-offset:3px; }
.citation { background:#f0f5f1; border-radius:6px; padding:.36rem .65rem; }
.citation-toggle { font:inherit; color:#155b50; background:transparent; border:0; padding:.1rem 0; text-align:left; cursor:pointer; }
.citation-toggle::before { content:"▸"; margin-right:.45rem; }
.citation-toggle[aria-expanded=true]::before { content:"▾"; }
.citation-toggle:focus-visible { outline:2px solid #127963; outline-offset:2px; }
.claims dl { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.5rem 1rem; margin:.4rem 0 .15rem; }
dt { color:#465d52; font-size:.85rem; }
dd { margin:0; overflow-wrap:anywhere; }
footer { border-top:1px solid #a3b9ad; color:#435d51; padding-top:.8rem; }
nav { display:flex; flex-wrap:wrap; gap:.4rem 1rem; margin-bottom:.8rem; }
a { color:#0f5a50; }
code { font-size:.79rem; overflow-wrap:anywhere; }
</style>
<main>
<header><h1>@TITLE@</h1><p id="briefing-count">@COUNT@</p><p id="briefing-scope">@SCOPE@</p></header>
@EMPTY@
<div id="briefing-sections">@SECTIONS@</div>
<footer>
<nav aria-label="Original evidence">
<a href="named-chart.html">Open the original chart</a>
<a href="claim-evidence.json" download>Claim evidence</a>
<a href="chart-data.json" download>Chart selection and data</a>
<a href="matched-comparison.csv" download>Original comparison CSV</a>
<a href="summary-proof.json" download>Verified summary</a>
</nav>
<details open><summary>Source and briefing verification</summary>
<p>Chart artifact <code id="original-chart">@CHART_ID@</code></p>
<p>Comparison export <code id="comparison-export">@EXPORT@</code></p>
<p>Source SHA-256 <code id="comparison-sha">@SOURCE_SHA@</code></p>
<p>Briefing SHA-256 <code id="briefing-audit" aria-live="polite"></code></p>
</details>
</footer>
</main>
<script>
for (const trigger of document.querySelectorAll('.citation-toggle')) {
    trigger.addEventListener('click',()=>{
        const target = document.getElementById(trigger.getAttribute('aria-controls'));
        target.hidden = !target.hidden;
        trigger.setAttribute('aria-expanded',String(!target.hidden));
    });
}
async function readBriefing() {
    const fields = [...document.querySelectorAll('[data-briefing-field]')].map(field=>field.textContent);
    const framed = fields.map(value=>value.length + ':' + value).join('');
    const digest = await crypto.subtle.digest('SHA-256',new TextEncoder().encode(framed));
    document.getElementById('briefing-audit').textContent =
        [...new Uint8Array(digest)].map(byte=>byte.toString(16).padStart(2,'0')).join('');
}
readBriefing().catch(error=>console.error(error.message));
</script>
</html>
