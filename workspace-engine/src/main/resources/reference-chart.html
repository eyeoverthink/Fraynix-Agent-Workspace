<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>%s</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; color: #17313a; background: #e9f0ed; font: 16px/1.5 system-ui, sans-serif; }
main { margin: auto; padding: clamp(16px,4vw,40px); max-width: 64rem; }
header { margin-bottom: 1.2rem; }
h1 { margin: .24rem 0; line-height: 1.08; font: 600 clamp(1.85rem,4vw,3rem)/1.08 Georgia, serif; }
p { margin: .45rem 0; }
figure { margin: 0; background: #fff; border: 1px solid #b6cbc5; border-radius: 12px; overflow: hidden; }
figcaption { position: relative; padding: 15px 20px 0; font-weight: 600; }
svg { width: 100%%; display: block; color: #35545a; }
.axis-labels { fill: currentColor; font: 13px system-ui,sans-serif; }
.legend { display: flex; flex-wrap: wrap; gap: 1rem; margin: 0; padding: 6px 20px 16px; list-style: none; }
.legend span { display: inline-block; width: .9rem; height: .2rem; margin: 0 .4rem .22rem 0; }
.source { margin-top: 1.1rem; }
.source code { overflow-wrap: anywhere; font-size: .82rem; }
a { color: #075a56; }
details { margin-top: .5rem; }
</style>
<main>
<header>
<p id="chart-origin">%s</p>
<h1 id="chart-title">%s</h1>
</header>
<figure>
<figcaption id="chart-caption">%s</figcaption>
<svg id="chart-svg" viewBox="0 0 752 320" role="img" aria-labelledby="chart-caption">
<path d="M92 41H708 M92 153H708 M92 265H708" fill="none" stroke="#d9e7e2"/>
<path d="M92 41V265H708" fill="none" stroke="#6e8b89"/>
%s
<g class="axis-labels">
<text id="chart-time-start" x="92" y="286">%s</text>
<text id="chart-time-end" x="708" y="286" text-anchor="end">%s</text>
<text id="chart-value-min" x="82" y="269" text-anchor="end">%s</text>
<text id="chart-value-middle" x="82" y="157" text-anchor="end">%s</text>
<text id="chart-value-max" x="82" y="45" text-anchor="end">%s</text>
<text x="400" y="309" text-anchor="middle">Time (s)</text>
</g>
</svg>
<ul class="legend">%s</ul>
</figure>
<section class="source">
<p>Source · <strong>%s</strong></p>
<p><a href="source.json" download>Download original samples and provenance</a></p>
<details open>
<summary>Source and verification hashes</summary>
<p>Source SHA-256 <code id="chart-source-sha">%s</code></p>
<p>Evidence SHA-256 <code>%s</code></p>
</details>
</section>
</main>
</html>
