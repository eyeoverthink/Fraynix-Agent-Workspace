
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; script-src 'sha256-@@SCRIPT_HASH@@'; style-src 'unsafe-inline'">
<title>Fraynix level</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; background: #101c22; color: #edf7f3; font: 16px system-ui, sans-serif }
  main { width: min(100%, 780px) }
  h1 { font-size: clamp(1.35rem, 4vw, 2rem); margin: 0 0 .65rem }
  canvas { display: block; width: 100%; border: 1px solid #638983; border-radius: .5rem }
  canvas:focus-visible { outline: 2px solid #9aebcb; outline-offset: 4px }
  footer { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .75rem; margin: 1rem 0 }
  p { margin: 0; color: #caddd7 }
  #controls { margin-bottom: .65rem }
  button { padding: .55rem .8rem; border: 1px solid #638983; border-radius: .4rem; color: inherit; background: #24403e; font: inherit; cursor: pointer }
</style>
</head>
<body>
<main>
  <h1>Fraynix level</h1>
  <p id="controls">Click the game to focus it. Move with ← and →. Jump with ↑ or Space.</p>
  <canvas tabindex="0" aria-label="Playable level" aria-describedby="controls"></canvas>
  <footer><p id="progress" role="status"></p><button id="restart">Restart level</button></footer>
</main>
<template id="level-data">@@LEVEL_DATA@@</template>
<script type="module">@@SCRIPT@@</script>
</body>
</html>
